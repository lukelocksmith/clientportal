<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8" />
  <title>SitePing manual test</title>
</head>
<body>
  <h1>Strona testowa</h1>
  <p>To jest testowy przycisk poniżej — kliknij go, potem otwórz widget (prawy dolny róg) i zgłoś anotację.</p>
  <button style="padding: 12px 24px; font-size: 16px;">Zamów teraz</button>

  <script src="/node_modules/@siteping/widget/dist/index.global.js"></script>
  <script>
    window.SitePing.initSiteping({
      endpoint: 'http://localhost:3000/api/siteping/siteping-test',
      projectName: 'siteping-test',
      enableScreenshot: true,
      identity: { name: 'Test Klient', email: 'test@example.com' },
      // WYMAGANE, nie opcjonalne: bez tego link „Zobacz na stronie" z opisu
      // zadania w ClickUpie otworzy zwykla strone i NICZEGO nie podświetli.
      // Widget czyta wtedy `?siteping=<id>` i sam przewija do zaznaczenia.
      deepLink: true,
      // SLAD TECHNICZNY: ostatnie wpisy z konsoli i nieudane zadania z chwili
      // zgloszenia. Trafiaja do ClickUpa jako WEWNETRZNY komentarz pod zadaniem.
      //
      // UWAGA PRZED WLACZENIEM U KLIENTA: konsola jego strony moze zawierac
      // cokolwiek, co ta strona loguje, lacznie z danymi jego uzytkownikow,
      // a adresy nieudanych zadan niosa pelny query string. Trzeba go o tym
      // uprzedzic. Tresci odpowiedzi widget NIE zbiera.
      captureDiagnostics: true,
    })
  </script>
</body>
</html>
